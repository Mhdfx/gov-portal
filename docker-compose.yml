 version: '3.8'

services:
  # PHP Application with php artisan serve
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: government-portal-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8001}:8001"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_NAME=${APP_NAME:-I.M System}
      - APP_URL=${APP_URL:-http://localhost:8001}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-government_portal}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=database
      - SESSION_LIFETIME=120
      - CACHE_STORE=file
      - QUEUE_CONNECTION=database
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@example.com}
      - MAIL_FROM_NAME="${APP_NAME}"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - government-portal-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: government-portal-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-government_portal}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - government-portal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: government-portal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - government-portal-network

  # PHPMyAdmin (Development only)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: government-portal-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "8080:80"
    networks:
      - government-portal-network
    depends_on:
      - db
    profiles:
      - dev

  # Mailhog (Development only)
  mailhog:
    image: mailhog/mailhog
    container_name: government-portal-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - government-portal-network
    profiles:
      - dev

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  government-portal-network:
    driver: bridge
